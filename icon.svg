<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- 背景渐变 -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 主圆形背景 -->
  <circle cx="64" cy="64" r="56" fill="url(#bgGrad)" filter="url(#glow)"/>
  
  <!-- 组件方块 -->
  <rect x="40" y="36" width="48" height="32" rx="4" fill="#ffffff" opacity="0.95"/>
  <rect x="46" y="42" width="12" height="12" rx="2" fill="#6366f1"/>
  <rect x="62" y="42" width="18" height="6" rx="1" fill="#9ca3af"/>
  <rect x="46" y="58" width="34" height="6" rx="1" fill="#d1d5db"/>
  
  <!-- 箭头 -->
  <path d="M64 80 L64 68 M64 80 L58 74 M64 80 L70 74" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- 魔法星星装饰 -->
  <polygon points="88,28 91,36 100,36 93,42 96,51 88,46 80,51 83,42 76,36 85,36" fill="#fbbf24" opacity="0.9"/>
  <polygon points="28,92 31,100 40,100 33,106 36,115 28,110 20,115 23,106 16,100 25,100" fill="#fbbf24" opacity="0.9"/>
  <circle cx="100" cy="100" r="4" fill="#fef3c7" opacity="0.8"/>
  <circle cx="20" cy="28" r="3" fill="#fef3c7" opacity="0.8"/>
  
  <!-- 闪光效果 -->
  <path d="M78 24 L82 28 M84 20 L88 24 M82 32 L86 36" stroke="#fef3c7" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M16 76 L20 80 M22 72 L26 76 M20 84 L24 88" stroke="#fef3c7" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
</svg>
